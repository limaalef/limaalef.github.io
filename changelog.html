    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Sports Archive">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <meta name="description" content="Histórico de atualizações do arquivo pessoal.">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://archive.limaalef.com/">
    <meta property="og:title" content="Sports Archive">
    <meta property="og:description" content="Histórico de atualizações do arquivo pessoal.">
    <meta property="og:image" content="https://archive.limaalef.com/banner.png">
    <meta property="og:image:width" content="763">

    <meta property="og:site_name" content="Sports Archive">
    <meta property="og:locale" content="pt_BR">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://archive.limaalef.com/">
    <meta name="twitter:title" content="Sports Archive">
    <meta name="twitter:description" content="Histórico de atualizações do arquivo pessoal.">
    <meta name="twitter:image" content="https://archive.limaalef.com/banner.png">
    <meta name="twitter:creator" content="@limaalef">
    <meta name="twitter:site" content="@limaalef">
    <!-- Ícones / manifest -->
    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/icons/site.webmanifest" />
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/request.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JJZTBEGJ91"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-JJZTBEGJ91');
    </script>
</head>
<body>
    <header>
        <div class="header-frame" id="header"
            data-title="Changelog"
            data-back="true">
        </div>
        
    </header>

    <div class="container">
        <div class="home-container">

            <div class="controls">
                <div class="filter-options">
                    <div class="filter-sub-group">
                        <div class="control-group">
                            <div class="dropdown-group">
                                <label data-i18n="items">Itens:</label>
                                <select class="f-select highlighted" id="limitFilter">
                                    <option value="10" selected>10</option>
                                    <option value="20">20</option>
                                    <option value="50">50</option>
                                </select>
                            </div>
                        </div>

                        <div class="control-group">
                            <div class="dropdown-group">
                                <label data-i18n="mode">Modo:</label>
                                <select class="f-select" id="modeFilter">
                                    <option value="" data-i18n="allContent">Todos</option>
                                    <option value="football" data-i18n="modeFootball">Futebol</option>
                                    <option value="multisport" data-i18n="modeMultisport">Multiesporte</option>
                                    <option value="motorsport" data-i18n="modeMotorsport">Automobilismo</option>
                                    <option value="carnaval" data-i18n="modeCarnaval">Carnaval</option>
                                </select>
                            </div>
                        </div>

                        <div class="control-group">
                            <div class="dropdown-group">
                                <label data-i18n="action">Ação:</label>
                                <select class="f-select" id="actionFilter">
                                    <option value="" data-i18n="allContent">Todas as ações</option>
                                    <option value="added" data-i18n="modeAdded">✅ Adicionados</option>
                                    <option value="modified" data-i18n="modeModified">✏️ Modificados</option>
                                    <option value="removed" data-i18n="modeRemoved">🗑️ Removidos</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pagination" id="pagination">
                    <div class="back-btn-group">
                        <button id="firstPage">«</button>
                        <button id="prevPage">‹</button>
                    </div>
                    <div class="pages-info-group">
                        <span class="label" data-i18n="page">Página</span>
                        <span class="value contrast" id="pageNumber">1</span>
                        <span class="label" data-i18n="pageSeparator">de</span>
                        <span class="value" id="pageTotal">1</span>
                    </div>
                    <div class="back-btn-group">
                        <button id="nextPage">›</button>
                        <button id="lastPage">»</button>
                    </div>
                </div>
            </div>

            <div class="changelog-group" id="changelogContent">
                <div class="state-box">
                    <div class="icon">⏳</div>
                    <h2 id="loadingTitle">Carregando changelog...</h2>
                    <p id="loadingMsg">Aguarde enquanto buscamos o histórico</p>
                </div>
            </div>
        </div>

        <div class="modal" id="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <button class="btn close-btn" onclick="MatchModal.close()">×</button>
                    <h2 class="modal-title" id="modalTitle">Detalhes da Partida</h2>
                    <div id="modalScore"></div>
                </div>
                <div class="modal-body" id="modalBody"></div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer"></div>

    <script src="js/config.js"></script>
    <script src="js/translation.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.service.js"></script>
    <script src="js/managers.js"></script>
    <script src="js/changelog.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/request.js"></script>
</body>
</html>
