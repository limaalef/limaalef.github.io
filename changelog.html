<body class="page-changelog">
    <header>
        <div class="header-frame" id="header"
            data-title="Changelog"
            data-back="true">
        </div>
        
    </header>

    <div class="container">
        <main class="changelog">
            <div class="changelog-controls">
                <div class="chip-group" id="modeFilter" role="group" aria-label="Modalidade" data-i18n-aria="mode">
                    <button class="chip active" type="button" data-value="" data-i18n="allContent">Todos</button>
                    <button class="chip" type="button" data-value="football" data-i18n="modeFootball">Futebol</button>
                    <button class="chip" type="button" data-value="multisport" data-i18n="modeMultisport">Multiesporte</button>
                    <button class="chip" type="button" data-value="motorsport" data-i18n="modeMotorsport">Automobilismo</button>
                    <button class="chip" type="button" data-value="carnaval" data-i18n="modeCarnaval">Carnaval</button>
                </div>
                <div class="changelog-controls-row">
                    <div class="chip-group" id="actionFilter" role="group" aria-label="Ação" data-i18n-aria="action">
                        <button class="chip active" type="button" data-value="" data-i18n="cl_actionAll">Todas as ações</button>
                        <button class="chip" type="button" data-value="added" data-i18n="cl_sectionAdded">Adicionados</button>
                        <button class="chip" type="button" data-value="modified" data-i18n="cl_sectionModified">Modificados</button>
                        <button class="chip" type="button" data-value="removed" data-i18n="cl_sectionRemoved">Removidos</button>
                    </div>
                    <label class="changelog-limit">
                        <span data-i18n="cl_perPage">Por página</span>
                        <select class="field field--select" id="limitFilter">
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                            <option value="50">50</option>
                        </select>
                    </label>
                </div>
            </div>

            <div class="changelog-news is-hidden" id="changelogNews" role="status"></div>
            <div class="changelog-timeline" id="changelogContent" aria-live="polite">
                <div class="skeleton-row"><span class="skeleton skeleton--short"></span><span class="skeleton skeleton--line"></span></div>
                <div class="skeleton-row"><span class="skeleton skeleton--line"></span></div>
                <div class="skeleton-row"><span class="skeleton skeleton--line"></span></div>
            </div>

            <nav class="paginator" id="pagination" aria-label="Paginação">
                <button class="paginator-button" type="button" id="firstPage" data-i18n-aria="cl_first" aria-label="Primeira página">«</button>
                <button class="paginator-button" type="button" id="prevPage" data-i18n-aria="cl_prev" aria-label="Página anterior">‹</button>
                <span class="paginator-status"><span data-i18n="page">Página</span> <strong id="pageNumber">1</strong> <span data-i18n="pageSeparator">de</span> <span id="pageTotal">1</span></span>
                <button class="paginator-button" type="button" id="nextPage" data-i18n-aria="cl_next" aria-label="Próxima página">›</button>
                <button class="paginator-button" type="button" id="lastPage" data-i18n-aria="cl_last" aria-label="Última página">»</button>
            </nav>
        </main>

        <div class="modal" id="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <button class="btn close-btn" onclick="MatchModal.close()">×</button>
                    <h2 class="modal-title" id="modalTitle">Detalhes da Partida</h2>
                    <div id="modalScore"></div>
                </div>
                <div class="modal-body" id="modalBody"></div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer"></div>

    <script src="js/config.js"></script>
    <script src="js/translation.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api_service.js"></script>
    <script src="js/managers.js"></script>
    <script src="js/changelog.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/request.js"></script>
</body>
</html>
