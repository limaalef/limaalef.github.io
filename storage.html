<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Sports Archive">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Storage — Sports Archive</title>
    <meta name="description" content="Gerenciamento de armazenamento do arquivo esportivo pessoal.">
    <meta name="robots" content="noindex">
    <meta name="author" content="@limaalef">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://archive.limaalef.com/">
    <meta property="og:title" content="Sports Archive">
    <meta property="og:description" content="Gerenciamento de armazenamento do arquivo esportivo pessoal.">
    <meta property="og:image" content="https://archive.limaalef.com/banner.png">
    <meta property="og:image:width" content="763">
    <meta property="og:image:height" content="241">
    <meta property="og:site_name" content="Sports Archive">
    <meta property="og:locale" content="pt_BR">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://archive.limaalef.com/">
    <meta name="twitter:title" content="Sports Archive">
    <meta name="twitter:description" content="Gerenciamento de armazenamento do arquivo esportivo pessoal.">
    <meta name="twitter:image" content="https://archive.limaalef.com/banner.png">
    <meta name="twitter:creator" content="@limaalef">
    <meta name="twitter:site" content="@limaalef">
    <!-- Ícones / manifest -->
    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/icons/site.webmanifest" />
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/order-ui.css">
    <link rel="stylesheet" href="css/storage.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JJZTBEGJ91"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-JJZTBEGJ91');
    </script>
</head>
<body>
    <header>
        <div class="header-frame" id="header"
            data-title="Storage"
            data-back="true">
        </div>

    </header>

    <main class="sd-page">

        <!-- Resumo geral dos discos físicos -->
        <section class="sd-summary" id="sdSummary" aria-label="Resumo do armazenamento">
            <div class="sd-skeleton">Carregando discos...</div>
        </section>

        <!-- Discos físicos -->
        <section class="sd-section">
            <div class="sd-section-head">
                <h2 class="sd-section-title">Discos <span class="sd-count" id="sdDiskCount"></span></h2>
                <span class="sd-updated" id="sdUpdated"></span>
            </div>

            <div class="sd-toolbar">
                <div class="sd-chips" id="sdChips" role="group" aria-label="Filtrar por situação"></div>
                <div class="sd-tools">
                    <input type="search" class="sd-search" id="sdSearch" placeholder="Buscar disco, modelo ou serial..." aria-label="Buscar disco">
                    <select class="sd-select" id="sdSort" aria-label="Ordenar">
                        <option value="free">Mais espaço livre</option>
                        <option value="pct">Maior uso (%)</option>
                        <option value="total">Maior capacidade</option>
                        <option value="archive">Mais arquivo</option>
                        <option value="name">Nome</option>
                    </select>
                </div>
            </div>

            <div class="sd-list" id="sdList" aria-live="polite"></div>
        </section>

        <!-- Nuvem e outros locais -->
        <section class="sd-section" id="sdOthersSection" hidden>
            <div class="sd-section-head">
                <h2 class="sd-section-title">Nuvem e outros locais</h2>
            </div>
            <div class="sd-list" id="sdOthers"></div>
        </section>

    </main>

    <!-- Ficha técnica do disco -->
    <div class="sd-modal" id="sdModal" hidden>
        <div class="sd-modal-card" role="dialog" aria-modal="true" aria-labelledby="sdModalTitle">
            <button type="button" class="sd-modal-close" id="sdModalClose" aria-label="Fechar">×</button>
            <div id="sdModalBody"></div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="js/config.js"></script>
    <script src="js/translation.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
</body>
</html>
