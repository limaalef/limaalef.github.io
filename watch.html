    <!-- Twitter Card -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:url" content="https://archive.limaalef.com/watch" id="twitter-url">
    <meta name="twitter:title" content="Assistir jogo - Sports Archive" id="twitter-title">

    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />

    <link rel="stylesheet" href="css/components.css">

    <link rel="stylesheet" href="css/match-page.css">
    <link rel="stylesheet" href="css/watch.css">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JJZTBEGJ91"></script>

</head>
<body class="page-match page-watch">
    <header>
        <div class="header-frame" id="header"
            data-title-key="watch"
            data-back="true">
        </div>
    </header>

    <div class="container">

        <!-- Loading -->
        <div id="watchLoading">
            <div class="state-box">
                <div class="icon">⏳</div>
                <h2 data-i18n="matchLoading">Carregando partida...</h2>
            </div>
        </div>

        <!-- Erro -->
        <div id="watchError" style="display:none;">
            <div class="state-box">
                <div class="icon">❌</div>
                <h2 data-i18n="matchNotFound">Partida não encontrada</h2>
                <p data-i18n="matchNotFoundHint">Verifique o ID na URL e tente novamente.</p>
            </div>
        </div>

        <!-- Conteúdo -->
        <div id="watchContent" style="display:none;">
            <div class="watch-page">

                <!-- Player (16:9) -->
                <div class="watch-player">
                    <iframe
                        id="videoPlayer"
                        src=""
                        frameborder="0"
                        allowfullscreen
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        hidden></iframe>
                    <div id="videoPlaceholder" class="watch-video-placeholder">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                        <span data-i18n="videoUnavailable">Vídeo indisponível</span>
                    </div>
                </div>

                <!-- Informações básicas da partida (montadas por watch.js): coladas na base do player -->
                <div class="watch-info" id="watchHero"></div>

                <!-- Escalação (única seção mantida além da capa) -->
                <div class="me-section" id="meLineupSection" style="display:none;">
                    <div class="section-title modal-style" data-i18n="lineup"></div>
                    <div class="me-lineup-grid" id="meLineupGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="js/config.js"></script>
    <script src="js/translation.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api_service.js"></script>
    <script src="js/managers.js"></script>
    <script src="js/watch.js"></script>
</body>
</html>
