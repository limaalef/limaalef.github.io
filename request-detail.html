<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Sports Archive">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Pedido — Sports Archive</title>
    <meta name="robots" content="noindex">
    <meta name="author" content="@limaalef">
    <!-- Ícones / manifest -->
    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/icons/site.webmanifest" />
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/request.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/request-detail.css">
</head>
<body>
    <header>
        <div class="header-frame" id="header" data-title="" data-back="true" data-reqbtn="false"></div>
    </header>

    <!-- Auth -->
    <div id="rd-auth">
        <div class="icon-lg">🔒</div>
        <h2 data-i18n="requestLoginRequired">Identificação necessária</h2>
        <p data-i18n="requestLoginRequiredDesc">Faça login para visualizar os detalhes do pedido.</p>
        <button class="om-oauth-btn om-google mt-3" id="rd-login-google">
            <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.29-8.16 2.29-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span data-i18n="requestLoginGoogle">Entrar com Google</span>
        </button>
    </div>
        
    <div class="is-hidden" id="rd-content">
        <div class="adm-layout narrow-width layout-inverted">
            <!-- Conteúdo -->
            <div class="adm-main px-5">
                <div class="rd-loading" id="rd-loading" data-i18n="requestLoadingOrder">Carregando pedido...</div>
                <div id="rd-order-body"></div>
            </div>

            <!-- Sidebar -->
            <aside class="adm-sidebar-right sidebar-wide">
                <div class="px-5" id="rd-order-sidebar"></div>
            </aside>
        </div>
    </div>

    <div id="footer"></div>

    <script src="js/config.js"></script>
    <script src="js/translation.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.service.js"></script>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script>
const RD_CFG = {
    apiBase:      CONFIG.REQUEST_API_BASE,
    paymentsBase: CONFIG.PAYMENTS_API_BASE || 'https://payments.limaalef.com',
};

// Estado de pagamento (preservado durante polling e entre sessões via KV)
let _lastOrder = null;   // último pedido carregado (para re-render ao trocar de idioma)
let _payState = {
    mpPaymentId:  null,
    pixCopyPaste: null,
    pixQrBase64:  null,
    amount:       null,
    expiresAt:    null,
    pollingTimer: null,
    countdownTimer: null,
    restored:     false,  // true = QR veio do servidor (não gerado nesta sessão)
};


function t(key) { return (LanguageManager ? LanguageManager.t(key) : null) || key; }
function loc() { return (LanguageManager && LanguageManager.getLanguage) ? LanguageManager.getLanguage() : 'pt-BR'; }

const orderId = new URLSearchParams(window.location.search).get('id');

const session = Auth.site;

// ── Auth ───────────────────────────────────────────────────────────────────
document.getElementById('rd-login-google').addEventListener('click', () => {
    session.login({ onSuccess: showContent });
});

async function showContent() {
    document.getElementById('rd-auth').classList.add('is-hidden');
    document.getElementById('rd-content').classList.remove('is-hidden');
    if (!orderId) { document.getElementById('rd-loading').textContent = t('requestNoOrderId'); return; }
    await handlePaypalReturn();   // volta do PayPal: captura antes de carregar o pedido
    await loadOrder();
    // Inicia polling e countdown uma única vez, após o primeiro carregamento
    if (_payState.mpPaymentId) {
        startPolling(_payState.mpPaymentId);
        if (_payState.expiresAt) startCountdown(_payState.expiresAt);
    }
}
if (session.restore()) showContent();

// ── Carregar pedido ────────────────────────────────────────────────────────
async function loadOrder() {
    document.getElementById('rd-loading').classList.remove('is-hidden');
    document.getElementById('rd-order-body').innerHTML      = '';
    try {
        const res = await session.fetch(`${RD_CFG.apiBase}/orders/${encodeURIComponent(orderId)}`);
        if (res.status === 401) return; // sessão encerrada pelo Auth
        if (res.status === 403) { document.getElementById('rd-loading').textContent = t('requestOrderForbidden'); return; }
        if (res.status === 404) { document.getElementById('rd-loading').textContent = t('requestOrderNotFound'); return; }

        const order = await res.json();
        _lastOrder = order;
        document.getElementById('rd-loading').classList.add('is-hidden');

        const hdr = document.getElementById('header');
        if (hdr) hdr.dataset.title = order.id;
        document.title = `${order.id} | Sports Archive`;

        // Restaura QR do servidor se o pagamento estiver pendente e houver dados salvos.
        // Só popula _payState — NÃO inicia polling aqui para evitar múltiplos setInterval.
        const pendingPay = order.payment;
        if (pendingPay?.status === 'pending' && pendingPay.mpPaymentId
            && pendingPay.pixQrBase64 && !_payState.mpPaymentId) {
            _payState.mpPaymentId  = String(pendingPay.mpPaymentId);
            _payState.pixCopyPaste = pendingPay.pixCopyPaste;
            _payState.pixQrBase64  = pendingPay.pixQrBase64;
            _payState.expiresAt    = pendingPay.expiresAt;
            _payState.restored     = true;
        }

        const detail = buildOrderDetail(order);
        document.getElementById('rd-order-body').innerHTML = detail.body;
        document.getElementById('rd-order-sidebar').innerHTML = detail.sidebar;

        // PayPal aprovado mas ainda não capturado (usuário não voltou / webhook atrasou): reconcilia sozinho
        if (order.payment?.provider === 'paypal' && order.payment.status === 'pending' && order.payment.paypalOrderId)
            startPaypalWatch(order.payment.paypalOrderId);

    } catch(e) {
        document.getElementById('rd-loading').textContent = '⚠ ' + e.message;
    }
}

// ── Render detalhe ─────────────────────────────────────────────────────────
function buildOrderDetail(o) {
    const now   = new Date();
    const dt    = new Date(o.createdAt).toLocaleString(loc(), { dateStyle:'long', timeStyle:'short' });
    const items = o.items || [];

    // Progress bar (inclui passo "Pagamento" quando o pedido está pronto)
    const steps = [
        { label: t('requestProgressReceived') },
        { label: t('requestProgressAnalysis')  },
        { label: t('requestProgressReady')     },
    ];
    const stepIdx = { pending:0, processing:1, ready:2, completed:3, expired:2, cancelled:2 };
    const curIdx  = stepIdx[o.status] ?? 0;

    const progressHtml = (o.status !== 'expired' && o.status !== 'cancelled') ? `
        <div class="rd-section-title" data-i18n="requestOrderStatus">${t('requestOrderStatus')}</div>
        <div class="prog">
            ${steps.map((s, i) => {
                let cls = '';
                if (i < curIdx)  cls = 'done';
                if (i === curIdx) cls = 'active';
                return `<div class="prog-conn ${cls} prog-conn-min"></div><div class="prog-step">
                            <div class="prog-dot ${cls}">${i < curIdx ? `<svg width="12" height="12" viewBox="0 0 8 8" fill="none"><path class="prog-dot-svg ${cls}" d="M1.5 4l2 2 3-3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>` : `<div class="prog-dot-svg2 ${cls} dot-6"></div>`}</div>
                            <span class="prog-lbl ${cls}">${s.label}</span>
                        </div>`;
            }).join('')}
        </div>` : ``;

    // ── Seção de valores de pagamento ──────────────────────────────────────
    const mpValueHtml = (o.paymentAmount > 0 && o.platformFeePercent != null && !o.paymentExternal) ? (() => {
        const fee     = o.platformFeePercent / 100;
        const total   = parseFloat(o.paymentAmount);
        const taxaVal = total * fee;
        const netVal  = total - taxaVal;
        const fmt = v => fmtMoney(v, 'BRL');
        return `
        <div class="rd-section-title" data-i18n="requestPaymentSummary">${t('requestPaymentSummary')}</div>
        <div class="detail-list">
            <div class="detail-list-item">
                <span class="detail-list-label">${t('requestValue')}</span>
                <span class="detail-list-value">${fmt(netVal)}</span>
            </div>
            <div class="detail-list-item">
                <span class="detail-list-label">${t('requestFee')} (${o.platformFeePercent}%)</span>
                <span class="detail-list-value text-secondary">${fmt(taxaVal)}</span>
            </div>
            <div class="detail-list-item bg-primary-fill">
                <span class="detail-list-label text-accent fw-700">${t('requestTotalValue')}</span>
                <span class="detail-list-value text-accent fw-700">${fmt(total)}</span>
            </div>
        </div>`;
    })() : ''

    // Pagamento externo: mesmo resumo do Mercado Pago (valor, taxa e total), enquanto não pago
    const paymentValueHtml = (o.paymentExternal && o.externalDueEffective && !o.externalPayment) ? (() => {
        const due     = o.externalDueEffective;
        const feePct  = o.externalFeePercent || 0;
        const total   = parseFloat(due.amount);
        const taxaVal = total * (feePct / 100);
        const netVal  = total - taxaVal;
        const fmt = v => fmtMoney(v, due.currency);
        return `
        <div class="rd-section-title" data-i18n="requestPaymentSummary">${t('requestPaymentSummary')}</div>
        <div class="detail-list">
            ${feePct > 0 ? `
            <div class="detail-list-item">
                <span class="detail-list-label">${t('requestValue')}</span>
                <span class="detail-list-value">${fmt(netVal)}</span>
            </div>
            <div class="detail-list-item">
                <span class="detail-list-label">${t('requestFee')} (${feePct}%)</span>
                <span class="detail-list-value text-secondary">${fmt(taxaVal)}</span>
            </div>` : ''}
            <div class="detail-list-item bg-primary-fill">
                <span class="detail-list-label text-accent fw-700">${t('requestTotalValue')}</span>
                <span class="detail-list-value text-accent fw-700">${fmt(total)}</span>
            </div>
        </div>`;
    })() : mpValueHtml;

    // ── Seção de pagamento Pix ─────────────────────────────────────────────
    const paymentHtml = buildPaymentSection(o);

    // ── Cards de download ──────────────────────────────────────────────────
    // Trava os downloads se pagamento for obrigatório e não estiver pago
    const pay     = o.payment;
    const payDone = pay?.status === 'approved' || o.status === 'completed' || o.paymentAccessGranted === true
        || !!o.externalPayment?.paidAt;
    // Pagamento externo (PayPal) também exige pagamento, mesmo sem valor em R$
    const payRequired = (o.paymentAmount > 0 || o.paymentExternal === true) && !payDone;

    const dlCardsHtml = items.map(item => {
        const link    = item.link;
        // Se pagamento obrigatório e não pago, bloqueia mesmo com link ativo
        const blocked = payRequired || !link || link.disabled ||
            (link.expiresAt && new Date(link.expiresAt) < now);
        const url     = (!payRequired && link) ? (link.proxyUrl || link.url || '#') : null;

        let expText = '', expCls = '';
        if (payRequired && !payDone) {
            expText = '🔒 ' + t('requestLockedAwaiting'); expCls = 'disabled';
        } else if (!link) {
            expText = t('requestLinkPending'); expCls = 'disabled';
        } else if (link.disabled) {
            expText = t('requestLinkDisabled'); expCls = 'disabled';
        } else if (link.expiresAt && new Date(link.expiresAt) < now) {
            expText = '⛔ ' + t('requestLinkExpired') + ' — ' + new Date(link.expiresAt).toLocaleDateString(loc());
            expCls  = 'expired';
        } else if (!link.expiresAt) {
            expText = '∞ ' + t('requestLinkNoExpiry'); expCls = 'indefinite';
        } else {
            const days = Math.ceil((new Date(link.expiresAt) - now) / 86_400_000);
            expText    = t('requestLinkValidDays').replace('{n}', days);
            expCls     = 'valid';
        }

        return `
        <div class="rd-dl-card ${(!blocked && link) ? 'available' : ''}">
            <div class="rd-dl-card-head">
                <div class="rd-dl-info">
                    <div class="rd-dl-label">${esc(item.label)}</div>
                    <div class="rd-dl-sub">${esc(item.meta||'')}${item.date ? ' · ' + esc(item.date) : ''}${item.station ? ' · ' + esc(item.station) : ''}</div>
                </div>
            </div>
            ${o.status === 'cancelled' ? '' :
            (payRequired && !payDone)
                ? `<div class="rd-locked-notice">⚠ ${t('requestLockedNotice')}</div>`
                : link
                    ? `<div class="rd-dl-card-body">
                        <div class="rd-dl-status-row">
                            <span class="rd-dl-exp ${expCls}">${expText}</span>
                            ${(!blocked && url)
                                ? `<a href="${url}" class="action-btn btn-primary no-underline" target="_blank" rel="noopener" download
                                   >${t('requestDownload')}</a>`
                                : ''}
                        </div>
                       </div>`
                    : `<div class="rd-dl-pending">${t('requestLinkPending')}</div>`
            }
        </div>`;
    }).join('');

    // Info
    const CONTACT_ICON = { email:'📧', whatsapp:'💬', telegram:'✈️', bluesky:'🦋', x:'𝕏' };
    const infoHtml = `
        <div class="detail-list">
            <div class="detail-list-item">
                <span class="detail-list-label" data-i18n="order">${t('order')}</span>
                <span class="detail-list-value">${esc(o.id)}</span>
            </div>
            <div class="detail-list-item">
                <span class="detail-list-label" data-i18n="date">${t('date')}</span>
                <span class="detail-list-value">${dt}</span>
            </div>
            <div class="detail-list-item">
                <span class="detail-list-label" data-i18n="requestContactInfo">${t('requestContactInfo')}</span>
                <span class="detail-list-value">
                    ${CONTACT_ICON[o.contact?.channel]||'📬'} ${esc(o.contact?.channel||'—')}: ${esc(o.contact?.value||'')}
                </span>
            </div>
            <div class="detail-list-item">
                <span class="detail-list-label" data-i18n="requestStatusLabel">${t('requestStatusLabel')}</span>
                <span class="detail-list-value"><span class="pill st-${o.status}">${statusPtBR(o.status)}</span></span>
            </div>
        </div>
        ${o.notes ? `<div class="rd-notes mt-3">📝 ${esc(o.notes)}</div>` : ''}
        
        <div class="section-divider-transparent"></div>

        ${progressHtml}

        <div class="section-divider"></div>

        ${paymentValueHtml}

        <div class="section-divider-transparent"></div>
        
        ${paymentHtml}`;

    return {
        body: `
            <div class="rd-section">
                <div class="rd-section-title" data-i18n="requestDownloads">${t('requestDownloads')}</div>
                <div class="rd-dl-list">${dlCardsHtml}</div>
            </div>
        `,
        sidebar: `
            <div class="rd-section">
                <div class="rd-section-title" data-i18n="requestOrderInfo">${t('requestOrderInfo')}</div>
                ${infoHtml}
            </div>
        `
    };
}

// ── Seção de pagamento Pix ─────────────────────────────────────────────────
function fmtMoney(amount, currency) {
    try {
        return new Intl.NumberFormat(loc(), { style: 'currency', currency }).format(amount);
    } catch (e) {
        return `${esc(currency)} ${Number(amount).toFixed(2)}`;
    }
}

// Pagamento externo (PayPal): registrado manualmente pelo admin
function buildExternalPaymentSection(o) {
    const ep = o.externalPayment;
    if (ep) {
        return `
        <div class="rd-section">
            <div class="rd-section-title" data-i18n="requestPaymentInfo">${t('requestPaymentInfo')}</div>
            <div class="detail-list">
                <div class="detail-list-item">
                    <span class="detail-list-label">${t('requestStatusLabel')}</span>
                    <span class="detail-list-value text-success">${t('requestPaymentApproved')}</span>
                </div>
                <div class="detail-list-item">
                    <span class="detail-list-label">${t('requestPaymentMethod')}</span>
                    <span class="detail-list-value">${t('requestPaymentMethodPayPal')}</span>
                </div>
                <div class="detail-list-item">
                    <span class="detail-list-label">${t('requestValue')}</span>
                    <span class="detail-list-value">${fmtMoney(ep.amount, ep.currency)}</span>
                </div>
                <div class="detail-list-item">
                    <span class="detail-list-label">${t('requestPaidAt')}</span>
                    <span class="detail-list-value">${new Date(ep.paidAt).toLocaleString(loc())}</span>
                </div>
                ${ep.reference ? `
                <div class="detail-list-item">
                    <span class="detail-list-label">ID</span>
                    <span class="detail-list-value">${esc(ep.reference)}</span>
                </div>` : ''}
            </div>
        </div>`;
    }
    if (o.paymentAccessGranted === true) return '';
    return `
    <div class="rd-section">
        <div class="rd-section-title" data-i18n="requestPaymentInfo">${t('requestPaymentInfo')}</div>
        <div class="rd-pay-card pay-required">
            <div class="rd-pay-head">
                <div>
                    <div class="rd-pay-title">${t('requestPaymentExternalTitle')}</div>
                    <div class="rd-pay-sub">${o.paypalEnabled ? t('requestPaymentViaPayPal') : t('requestPaymentExternalDesc')}</div>
                </div>
            </div>
            ${o.externalDueEffective ? `
            <div class="rd-pay-body">
                <div class="detail-list-item">
                    <span class="detail-list-label">${t('requestAmountDue')}</span>
                    <span class="detail-list-value fw-700 text-accent">${fmtMoney(o.externalDueEffective.amount, o.externalDueEffective.currency)}</span>
                </div>
            </div>` : ''}
            ${buildPaypalAction(o)}
        </div>
    </div>`;
}

// Botão "Pagar com PayPal" (só quando o Worker tem credenciais; senão mantém o fluxo manual)
function buildPaypalAction(o) {
    if (!o.paypalEnabled) return '';
    if (o.status !== 'ready') {
        return `<div class="rd-pp-wrap"><div class="rd-pp-hint">${t('requestPaypalWhenReady')}</div></div>`;
    }
    return `
    <div class="rd-pp-wrap">
        <div class="rd-pp-err is-hidden" id="rd-pp-err"></div>
        <button class="action-btn btn-primary rd-pp-btn" id="rd-pp-btn" onclick="startPaypal()">${t('requestPayWithPayPal')}</button>
        <div class="rd-pp-hint">${t('requestPaypalRedirectHint')}</div>
    </div>`;
}

function buildPaymentSection(o) {
    if (o.externalPayment || o.paymentExternal === true) return buildExternalPaymentSection(o);
    // Só exibe se o pedido estiver "ready" e tiver valor configurado
    if (!o.paymentAmount || o.paymentAmount <= 0) return '';
    // Acesso liberado manualmente pelo admin — não exibe seção de pagamento
    if (o.paymentAccessGranted === true) return '';

    const pay    = o.payment;

    // Pago / pedido concluído
    if (pay?.status === 'approved' || o.status === 'completed') {
        return `
        <div class="rd-section">
            <div class="rd-section-title" data-i18n="requestPaymentInfo">${t('requestPaymentInfo')}</div>
            <div class="detail-list">
                <div class="detail-list">
                    <div class="detail-list-item">
                        <span class="detail-list-label">${t('requestStatusLabel')}</span>
                        <span class="detail-list-value text-success">${t('requestPaymentApproved')}</span>
                    </div>
                    ${pay?.mpPaymentId ? `
                    <div class="detail-list-item">
                        <span class="detail-list-label">ID</span>
                        <span class="detail-list-value">${esc(String(pay.mpPaymentId))}</span>
                    </div>` : ''}
                    ${pay?.paidAt ? `
                    <div class="detail-list-item">
                        <span class="detail-list-label">${t('requestPaidAt')}</span>
                        <span class="detail-list-value">${new Date(pay.paidAt).toLocaleString(loc())}</span>
                    </div>` : ''}
                </div>
            </div>
        </div>`;
    }

    // Cancelado/expirado
    if (pay?.status === 'cancelled') {
        return `
        <div class="rd-section">
            <div class="rd-section-title" data-i18n="requestPaymentInfo">${t('requestPaymentInfo')}</div>
            <div class="rd-pay-card bc-error">
                <div class="rd-pay-head bg-error-fill">
                    <span class="rd-pay-icon">❌</span>
                    <div>
                        <div class="rd-pay-title">${t('requestPaymentCancelled')}</div>
                        <div class="rd-pay-sub">${t('requestPaymentCancelledDesc')}</div>
                    </div>
                </div>
            </div>
        </div>`;
    }

    // Aguardando pagamento — QR pendente (gerado nesta sessão ou restaurado do servidor)
    const hasPendingQr = pay?.status === 'pending' && _payState.mpPaymentId;

    return `
    <div class="rd-section">
        <div class="rd-section-title" data-i18n="requestPaymentInfo">${t('requestPaymentInfo')}</div>
        <div class="rd-pay-card ${hasPendingQr ? 'pay-pending' : 'pay-required'}" id="rd-pay-card">
            <div class="rd-pay-head">
                <div>
                    <div class="rd-pay-title">${hasPendingQr ? t('requestPaymentWaiting') : t('requestPaymentRequired')}</div>
                    <div class="rd-pay-sub">${hasPendingQr ? t('requestPaymentScanQr') : t('requestPaymentViaPix')}</div>
                </div>
            </div>
            <div class="rd-pay-body" id="rd-pay-body">
                ${hasPendingQr ? renderQrStep() : renderCpfStep()}
            </div>
        </div>
    </div>`;
}

function renderCpfStep() {
    return `
    <div class="rd-cpf-field">
        <div class="detail-list-item">
            <span class="detail-list-label">${t('requestCPFPayer')}</span>
            <span class="detail-list-value">
                <input id="rd-cpf-input" class="adm-input adm-input-text" maxlength="14"
                    inputmode="numeric" placeholder="000.000.000-00"
                    oninput="maskCpf(this)"
                    onkeydown="if(event.key==='Enter') submitCpf()">
            </span>
        </div>
        
        <div class="rd-cpf-hint">${t('requestFiscalRequirement')}</div>
        <div class="rd-cpf-err is-hidden" id="rd-cpf-err"></div>
    </div>
    <button class="action-btn btn-primary w-inset-4"
        onclick="submitCpf()">
        ${t('requestGenerateQr')}
    </button>`;
}

function renderQrStep() {
    const ps = _payState;
    return `
    <div class="rd-qr-wrap">
        ${ps.pixQrBase64
            ? `<img class="rd-qr-img" src="data:image/png;base64,${ps.pixQrBase64}" alt="QR Code Pix">`
            : `<div class="rd-qr-img d-flex items-center justify-center text-tertiary">${t('requestQrUnavailable')}</div>`
        }
        <div class="rd-qr-copy-wrap">
            ${ps.pixCopyPaste ? `
            <div class="rd-qr-code-text" id="rd-qr-code-text">${esc(ps.pixCopyPaste)}</div>
            <button class="action-btn btn-ghost w-full justify-center"
                onclick="copyCodigo()">
                ${t('requestPixCopyPaste')}
            </button>` : ''}
        </div>
        <div class="rd-qr-timer" id="rd-qr-timer">⏱ ${t('requestValidFor')} <span id="rd-countdown">—</span></div>
        <div class="rd-poll-status">
            <div class="rd-poll-dot"></div>
            ${t('requestCheckingPayment')}
        </div>
    </div>`;
}

// ── CPF / Geração do QR ────────────────────────────────────────────────────
function maskCpf(input) {
    let v = input.value.replace(/\D/g, '').slice(0, 11);
    if (v.length > 9)      v = v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6,9)+'-'+v.slice(9);
    else if (v.length > 6) v = v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6);
    else if (v.length > 3) v = v.slice(0,3)+'.'+v.slice(3);
    input.value = v;
}

function cpfValid(cpf) {
    const d = cpf.replace(/\D/g, '');
    if (d.length !== 11 || /^(\d)\1+$/.test(d)) return false;
    let s = 0;
    for (let i = 0; i < 9; i++) s += parseInt(d[i]) * (10 - i);
    let r = (s * 10) % 11; if (r === 10 || r === 11) r = 0;
    if (r !== parseInt(d[9])) return false;
    s = 0;
    for (let i = 0; i < 10; i++) s += parseInt(d[i]) * (11 - i);
    r = (s * 10) % 11; if (r === 10 || r === 11) r = 0;
    return r === parseInt(d[10]);
}

async function submitCpf() {
    const input  = document.getElementById('rd-cpf-input');
    const errEl  = document.getElementById('rd-cpf-err');
    const cpf    = input?.value || '';

    if (!cpfValid(cpf)) {
        errEl.textContent    = t('requestCPFError');
        errEl.classList.remove('is-hidden');
        input?.focus();
        return;
    }
    errEl.classList.add('is-hidden');

    const body = document.getElementById('rd-pay-body');
    body.innerHTML = `<div class="text-center p-5"><div class="rd-spinner"></div><div class="mt-3 text-secondary text-sm">${t('requestGeneratingPix')}</div></div>`;

    try {
        const res  = await session.fetch(`${RD_CFG.paymentsBase}/payments/create`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderId, cpf: cpf.replace(/\D/g, '') }),
        });
        const data = await res.json();

        if (!res.ok) {
            body.innerHTML = `
                <div class="text-error mb-4">
                    ⚠ ${esc(data.error || t('requestPaymentError'))}
                </div>
                ${renderCpfStep()}`;
            return;
        }

        _payState.mpPaymentId  = String(data.paymentId);
        _payState.pixCopyPaste = data.pixCopyPaste;
        _payState.pixQrBase64  = data.pixQrBase64;
        _payState.amount       = data.amount;
        _payState.expiresAt    = data.expiresAt;

        body.innerHTML = renderQrStep();
        startCountdown(data.expiresAt);
        startPolling(_payState.mpPaymentId);

    } catch(e) {
        body.innerHTML = `
            <div class="text-error mb-4">⚠ ${esc(e.message)}</div>
            ${renderCpfStep()}`;
    }
}

function copyCodigo() {
    const code = _payState.pixCopyPaste;
    if (!code) return;
    navigator.clipboard.writeText(code).then(() => {
        const btn = event.target;
        btn.textContent = t('requestCopied');
        setTimeout(() => { btn.textContent = t('requestPixCopyPaste'); }, 2000);
    });
}

// ── Countdown ──────────────────────────────────────────────────────────────
function startCountdown(expiresAt) {
    if (_payState.countdownTimer) clearInterval(_payState.countdownTimer);
    if (!expiresAt) return;

    function tick() {
        const el  = document.getElementById('rd-countdown');
        if (!el) { clearInterval(_payState.countdownTimer); return; }
        const ms  = new Date(expiresAt) - Date.now();
        if (ms <= 0) {
            el.textContent = t('requestCountdownExpired');
            clearInterval(_payState.countdownTimer);
            return;
        }
        const h = Math.floor(ms / 3_600_000);
        const m = Math.floor((ms % 3_600_000) / 60_000);
        const s = Math.floor((ms % 60_000) / 1_000);
        el.textContent = h > 0
            ? `${h}h ${m.toString().padStart(2,'0')}m`
            : `${m}m ${s.toString().padStart(2,'0')}s`;
    }
    tick();
    _payState.countdownTimer = setInterval(tick, 1000);
}

// ── PayPal: redirecionamento e retorno ─────────────────────────────────────
async function startPaypal() {
    const btn   = document.getElementById('rd-pp-btn');
    const errEl = document.getElementById('rd-pp-err');
    if (!btn || btn.disabled) return;
    errEl.classList.add('is-hidden');
    btn.disabled    = true;
    btn.textContent = t('requestPaypalRedirecting');
    try {
        const res  = await session.fetch(`${RD_CFG.paymentsBase}/paypal/create`, {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ orderId }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.approveUrl) throw new Error(data.error || t('requestPaypalError'));
        window.location.href = data.approveUrl;
    } catch (e) {
        errEl.textContent = '⚠ ' + e.message;
        errEl.classList.remove('is-hidden');
        btn.disabled    = false;
        btn.textContent = t('requestPayWithPayPal');
    }
}

// O PayPal volta em ?id=..&paypal=return&token=<ordem> (ou paypal=cancel)
async function handlePaypalReturn() {
    const params = new URLSearchParams(location.search);
    const flag   = params.get('paypal');
    if (!flag) return;
    const token = params.get('token');
    // limpa a URL para um F5 não tentar capturar de novo
    history.replaceState(null, '', `${location.pathname}?id=${encodeURIComponent(orderId)}`);

    if (flag === 'cancel') { Utils.showNotification(t('requestPaypalCancelled'), 'info'); return; }
    if (flag !== 'return' || !token) return;

    document.getElementById('rd-loading').textContent = t('requestPaypalConfirming');
    try {
        const res  = await session.fetch(`${RD_CFG.paymentsBase}/paypal/capture`, {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ token }),
        });
        const data = await res.json().catch(() => ({}));
        if (data.paid)                      Utils.showNotification(t('requestPaypalApproved'), 'success');
        else if (data.status === 'pending') Utils.showNotification(t('requestPaypalPending'), 'info');
        else                                Utils.showNotification(data.error || t('requestPaypalError'), 'error');
    } catch (e) {
        Utils.showNotification(t('requestPaypalError'), 'error');
    }
}

// Consulta periódica: /paypal/capture é idempotente e só conclui se o usuário já aprovou no PayPal.
// Funciona mesmo sem webhook configurado. Para após 10 min (a página recomeça ao recarregar).
let _ppWatch = null;
function stopPaypalWatch() { if (_ppWatch) { clearInterval(_ppWatch); _ppWatch = null; } }
function startPaypalWatch(ppOrderId) {
    if (_ppWatch) return;
    const started = Date.now();
    _ppWatch = setInterval(async () => {
        if (Date.now() - started > 10 * 60_000) return stopPaypalWatch();
        try {
            const res  = await session.fetch(`${RD_CFG.paymentsBase}/paypal/capture`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ token: ppOrderId }),
            });
            const data = await res.json().catch(() => ({}));
            if (data.paid) {
                stopPaypalWatch();
                Utils.showNotification(t('requestPaypalApproved'), 'success');
                loadOrder();
            }
        } catch (e) { console.warn('[paypal-watch]', e.message); }
    }, 8000);
}

// Voltar (botão do navegador) a partir do PayPal pode restaurar a página do cache com o botão travado
window.addEventListener('pageshow', e => { if (e.persisted && _lastOrder) loadOrder(); });

// ── Polling de status ──────────────────────────────────────────────────────
function startPolling(mpPaymentId) {
    if (_payState.pollingTimer) clearInterval(_payState.pollingTimer);

    async function poll() {
        try {
            const res  = await session.fetch(`${RD_CFG.paymentsBase}/payments/${mpPaymentId}/status`);
            const data = await res.json();

            if (data.paid || data.status === 'approved' || data.status === 'completed') {
                clearInterval(_payState.pollingTimer);
                clearInterval(_payState.countdownTimer);
                _payState.pollingTimer   = null;
                _payState.countdownTimer = null;
                _payState.mpPaymentId    = null;
                _payState.pixQrBase64    = null;
                _payState.pixCopyPaste   = null;
                loadOrder(); // recarrega para exibir links — não reinicia polling
            } else if (data.status === 'cancelled') {
                clearInterval(_payState.pollingTimer);
                _payState.pollingTimer = null;
                _payState.mpPaymentId  = null;
                loadOrder();
            }
        } catch(e) {
            console.warn('[poll]', e.message);
        }
    }

    _payState.pollingTimer = setInterval(poll, 5000);
    poll(); // imediato
}

// Re-renderiza ao trocar de idioma
document.addEventListener('languagechange', () => {
    if (!_lastOrder) return;
    const detail = buildOrderDetail(_lastOrder);
    document.getElementById('rd-order-body').innerHTML   = detail.body;
    document.getElementById('rd-order-sidebar').innerHTML = detail.sidebar;
    if (_payState.expiresAt && _payState.mpPaymentId) startCountdown(_payState.expiresAt);
});

// ── Utils ──────────────────────────────────────────────────────────────────
function statusPtBR(s) {
    return {
        pending:   t('requestStatusPending'),
        processing: t('requestStatusProcessing'),
        ready:     t('requestStatusReady'),
        completed:   t('requestStatusCompleted'),
        expired:   t('requestStatusExpired'),
        cancelled: t('requestStatusCancelled'),
    }[s] || s;
}

function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
