<body class="page-collection">
    <header>
        <div class="header-frame" id="header"
            data-title-key="navCollection"
            data-back="true"
            data-actions='
                <div class="chip-group sport-selector" role="group" aria-label="Esporte">
                    <button class="chip sport-chip football active" type="button" data-sport="football" id="footballBtn" aria-pressed="true">
                        <svg class="inline-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8.2l3.4 2.5-1.3 4h-4.2l-1.3-4z"/><path d="M12 3.5v4.7M15.4 10.7l4.3-1.4M14.1 14.7l2.7 3.6M9.9 14.7l-2.7 3.6M8.6 10.7L4.3 9.3"/></svg><span class="sport-chip-name" data-i18n="football">Futebol</span>
                    </button>
                    <button class="chip sport-chip multisport" type="button" data-sport="multisport" id="multisportBtn" aria-pressed="false">
                        <svg class="inline-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5v17"/><path d="M6 6.2c3 2.6 3 8.9 0 11.6M18 6.2c-3 2.6-3 8.9 0 11.6"/></svg><span class="sport-chip-name" data-i18n="otherSports">Outros esportes</span>
                    </button>
                    <button class="chip sport-chip motor" type="button" data-sport="motor" id="motorBtn" aria-pressed="false">
                        <svg class="inline-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20.5V4"/><path d="M5 5h14l-2.5 4 2.5 4H5"/></svg><span class="sport-chip-name" data-i18n="motorSports">Automobilismo</span>
                    </button>
                    <button class="chip sport-chip carnaval" type="button" data-sport="carnaval" id="carnavalBtn" aria-pressed="false">
                        <svg class="inline-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 5.5c4-1.5 11-1.5 15 0v5.2a7.5 7.5 0 0 1-15 0z"/><path d="M8.5 10.2h.01M15.5 10.2h.01"/><path d="M9 14.5c1.7 1.5 4.3 1.5 6 0"/></svg><span class="sport-chip-name">Carnaval</span>
                    </button>
                </div>
            '>        
        </div>
    </header>
    
    <div class="container">
        <div class="stat-tile-grid collection-stats" id="stats" style="display: none;">
            <div class="stat-tile stat-tile--highlight"><div class="stat-tile-value" id="totalGames">0</div><div class="stat-tile-label" data-i18n="games">Jogos</div></div>
            <div class="stat-tile"><div class="stat-tile-value" id="totalFiles">0</div><div class="stat-tile-label" data-i18n="totalfiles">Itens totais</div></div>
            <div class="stat-tile"><div class="stat-tile-value" id="totalSize">0 GB</div><div class="stat-tile-label" data-i18n="totalSize">Tamanho Total</div></div>
            <div class="stat-tile"><div class="stat-tile-value" id="totalDuration">0h</div><div class="stat-tile-label" data-i18n="totalDuration">Duração Total</div></div>
        </div>

        <div class="collection-controls">
            <label class="collection-filter">
                <span data-i18n="items">Itens</span>
                <select class="field field--select" id="itemsPerPage">
                    <option value="52" selected>52</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                </select>
            </label>
            <label class="collection-filter">
                <span data-i18n="years">Anos</span>
                <select class="field field--select" id="yearFilter">
                    <option value="" data-i18n="allYears">Todos os anos</option>
                </select>
            </label>
            <div class="search-box collection-search">
                <input type="search" class="field" id="searchInput" data-i18n-placeholder="search" placeholder="Buscar..." autocomplete="off">
            </div>
            <nav class="paginator" id="pagination" aria-label="Paginação">
                <button class="paginator-button" type="button" id="firstPage" data-i18n-aria="cl_first" aria-label="Primeira página">«</button>
                <button class="paginator-button" type="button" id="prevPage" data-i18n-aria="cl_prev" aria-label="Página anterior">‹</button>
                <span class="paginator-status"><strong id="pageNumber">1</strong> <span data-i18n="pageSeparator">de</span> <span id="pageTotal">1</span></span>
                <button class="paginator-button" type="button" id="nextPage" data-i18n-aria="cl_next" aria-label="Próxima página">›</button>
                <button class="paginator-button" type="button" id="lastPage" data-i18n-aria="cl_last" aria-label="Última página">»</button>
            </nav>
        </div>

        <div class="match-container" id="matchesContainer">
            <div class="empty-state">
                <h2 data-i18n="loading">Carregando jogos...</h2>
                <p data-i18n="loadingMessage">Aguarde enquanto buscamos os dados</p>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="btn close-btn" onclick="MatchModal.close()">×</button>
                <h2 class="modal-title" id="modalTitle">Detalhes da Partida</h2>
                <div id="modalScore" class="modal-score"></div>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>
    
    <!-- Footer -->
    <div id="footer"></div>
    
    <script src="js/config.js"></script>
    <script src="js/translation.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/ui-components.js"></script>
    <script src="js/api_service.js"></script>
    <script src="js/managers.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/request.js"></script>
</body>
</html>
