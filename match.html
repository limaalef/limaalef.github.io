<body class="page-match">
    <header>
        <div class="header-frame" id="header"
            data-title-key="evento"
            data-back="true">
        </div>

    </header>

    <div class="container">

        <!-- Loading state -->
        <div id="matchEnrichedLoading">
            <div class="state-box">
                <div class="icon">⏳</div>
                <h2 data-i18n="matchLoading">Carregando partida...</h2>
            </div>
        </div>

        <!-- Erro -->
        <div id="matchEnrichedError" style="display:none;">
            <div class="state-box">
                <div class="icon">❌</div>
                <h2 data-i18n="matchNotFound">Partida não encontrada</h2>
                <p data-i18n="matchNotFoundHint">Verifique o ID na URL e tente novamente.</p>
            </div>
        </div>

        <!-- Conteúdo -->
        <div id="matchEnrichedContent" style="display:none;">

            <!-- ── CAPA: carrossel de imagens (16:9) + título, placar e ações (montados por match.js) ── -->
            <div class="me-hero" id="meHero"></div>

            <!-- ── SEÇÕES ── -->
            <div class="me-body" id="meBody">
                <div class="match-column match-column--main">
                    <!-- MOMENTOS MARCANTES (tags) -->
                    <div class="detail-section" id="meTagsSection" style="display:none;">
                        <div class="section-title modal-style" data-i18n="observations"></div>
                        <div class="detail-item" style="grid-column: 1/-1;">
                            <div class="detail-value" id="meObs"></div>
                        </div>
                        <div class="me-tags-wrap" id="meTagsList"></div>
                    </div>

                    <div class="me-section" id="meLineupSection" style="display:none;">
                        <div class="section-title modal-style" data-i18n="lineup"></div>
                        <div class="me-lineup-grid" id="meLineupGrid"></div>
                    </div>

                    <div class="me-section" id="mePlaysSection" style="display:none;">
                        <div class="section-title modal-style" data-i18n="plays"></div>
                        <div class="detail-list plays-list" id="mePlaysList"></div>
                    </div>

                    <div class="me-section" id="mePenaltiesSection" style="display:none;">
                        <div class="section-title modal-style" data-i18n="penalties"></div>
                        <div class="detail-list plays-list" id="mePenaltiesList"></div>
                    </div>

                    <div class="detail-section" id="meStatisticsSection" style="display:none;">
                        <div class="section-title modal-style" data-i18n="statistics"></div>
                        <div class="detail-list me-stats-list" id="meStatisticsInfo"></div>
                    </div>
                </div>

                <aside class="match-column match-column--side">
                    <div class="match-aside" id="meAside">
                        <div class="match-aside-inner">
                            <section class="match-aside-section" hidden>
                                <h3 class="block-title" data-i18n="broadcastInfo"></h3>
                                <div id="meTvInfo"></div>
                            </section>

                            <section class="match-aside-section" hidden>
                                <h3 class="block-title" data-i18n="refereeInfo"></h3>
                                <div id="meRefereeInfo"></div>
                            </section>

                            <section class="match-aside-section" hidden>
                                <h3 class="block-title" data-i18n="attRevInfo"></h3>
                                <div id="meAttRevInfo"></div>
                            </section>

                            <section class="match-aside-section" hidden>
                                <h3 class="block-title" data-i18n="fileInfo"></h3>
                                <div id="meTechInfo"></div>
                                <div class="match-aside-method" id="meStorage" hidden></div>
                            </section>
                        </div>
                    </div>
                </aside>
            </div>

            <!-- Corpo de eventos (carnaval e motorsport), montado por match-events.js -->
            <div class="me-body" id="meEventBody" hidden></div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="js/config.js"></script>
    <script src="js/translation.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api_service.js"></script>
    <script src="js/managers.js"></script>
    <script src="js/ui-components.js"></script>
    <script src="js/match.js"></script>
    <script src="js/match-events.js"></script>
    <script src="js/request.js"></script>
</body>
</html>
