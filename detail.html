<body class="theme-football page-detail">
    <header>
        <div class="header-frame" id="header"
            data-title-key="navCollection"
            data-back="true">
        </div>
        
    </header>

    <div class="container">
        <div class="collection-layout">

            <!-- SIDEBAR: a entidade da busca (time, competição, narrador ou disco) -->
            <aside class="collection-sidebar" id="collectionSidebar">

                <div class="sidebar-loading" id="sidebarLoading" aria-busy="true">
                    <div class="sidebar-skeleton-emblem"></div>
                    <div class="sidebar-skeleton-line wide"></div>
                    <div class="sidebar-skeleton-line medium"></div>
                </div>

                <div class="sidebar-content" id="sidebarContent" style="display:none;">
                    <div class="sidebar-sport-header">
                        <div class="entity-image" id="entityImage" data-shape="emblem"></div>
                        <div class="sidebar-header-text-group">
                            <h1 class="sidebar-sport-name" id="sidebarName"></h1>
                            <div class="sidebar-sport-meta" id="sidebarMeta"></div>
                        </div>
                    </div>

                    <div class="stat-tile-grid sidebar-stats" id="stats" style="display:none;">
                        <div class="stat-tile stat-tile--highlight"><div class="stat-tile-value" id="totalGames">0</div><div class="stat-tile-label" data-i18n="games">Jogos</div></div>
                        <div class="stat-tile"><div class="stat-tile-value" id="totalFiles">0</div><div class="stat-tile-label" data-i18n="totalfiles">Itens totais</div></div>
                        <div class="stat-tile"><div class="stat-tile-value" id="totalSize">0 GB</div><div class="stat-tile-label" data-i18n="totalSize">Tamanho Total</div></div>
                        <div class="stat-tile"><div class="stat-tile-value" id="totalDuration">0h</div><div class="stat-tile-label" data-i18n="totalDuration">Duração Total</div></div>
                    </div>

                    <div class="sidebar-details" id="sidebarDetails"></div>
                    <div class="sidebar-description" id="sidebarDescription"></div>
                </div>
            </aside>

            <!-- CONTEÚDO PRINCIPAL -->
            <div class="collection-main">

                <div class="detail-state" id="noQueryState" style="display:none;">
                    <h2 data-i18n="detailNoQuery">Nenhuma busca definida</h2>
                    <p data-i18n="detailNoQueryHint">Acesse esta página a partir do acervo ou da página inicial.</p>
                </div>

                <div class="detail-controls" id="mainControls" style="display:none;">
                    <label class="detail-filter">
                        <span data-i18n="years">Anos</span>
                        <select class="field field--select" id="yearFilterBar">
                            <option value="" data-i18n="allYears">Todos os anos</option>
                        </select>
                    </label>
                    <div class="detail-search">
                        <input type="search" class="field" id="searchInput" data-i18n-placeholder="search" placeholder="Buscar..." autocomplete="off">
                    </div>
                    <nav class="paginator" id="pagination" aria-label="Paginação">
                        <button class="paginator-button" type="button" id="firstPage" data-i18n-aria="cl_first" aria-label="Primeira página">«</button>
                        <button class="paginator-button" type="button" id="prevPage" data-i18n-aria="cl_prev" aria-label="Página anterior">‹</button>
                        <span class="paginator-status"><strong id="pageNumber">1</strong> <span data-i18n="pageSeparator">de</span> <span id="pageTotal">1</span></span>
                        <button class="paginator-button" type="button" id="nextPage" data-i18n-aria="cl_next" aria-label="Próxima página">›</button>
                        <button class="paginator-button" type="button" id="lastPage" data-i18n-aria="cl_last" aria-label="Última página">»</button>
                    </nav>
                </div>

                <div class="match-container" id="matchesContainer">
                    <div class="detail-state">
                        <h2 data-i18n="loading">Carregando jogos...</h2>
                        <p data-i18n="loadingMessage">Aguarde enquanto buscamos os dados</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="btn close-btn" onclick="MatchModal.close()">×</button>
                <h2 class="modal-title" id="modalTitle">Detalhes da Partida</h2>
                <div id="modalScore" class="modal-score"></div>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="js/config.js"></script>
    <script src="js/translation.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api_service.js"></script>
    <script src="js/managers.js"></script>
    <script src="js/ui-components.js"></script>
    <script src="js/collections.js"></script>
    <script src="js/detail.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/request.js"></script>
</body>
</html>
