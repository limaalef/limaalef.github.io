<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Sports Archive">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Meus Pedidos — Sports Archive</title>
    <meta name="robots" content="noindex">
    <meta name="author" content="@limaalef">
    <!-- Ícones / manifest -->
    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/icons/site.webmanifest" />
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/request.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/my-requests.css">
</head>
<body>
    <header>
        <div class="header-frame" id="header"
            data-title=""
            data-back="true"
            data-reqbtn="false"></div>
    </header>

    <!-- Auth -->
    <div id="rq-auth">
        <div class="icon-lg">📦</div>
        <h2 data-i18n="requestMyRequests">Meus Pedidos</h2>
        <p data-i18n="requestMyRequestsDesc">Faça login para acompanhar seus pedidos e acessar os links de download.</p>
        <button class="om-oauth-btn om-google mt-3" id="rq-login-google">
            <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.29-8.16 2.29-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span data-i18n="requestLoginGoogle">Entrar com Google</span>
        </button>
    </div>

    <!-- Dashboard -->
    <div class="is-hidden" id="rq-dashboard">
        <div class="adm-layout narrow-width">
            <!-- Sidebar -->
            <aside class="adm-sidebar">
                <div class="profile-box">
                    <img id="rq-avatar" class="profile-avatar" src="" onerror="this.hidden=true" alt="">
                    <div>
                        <div class="profile-user-name" id="rq-user-name"></div>
                        <button class="action-btn btn-ghost btn-xs" id="rq-refresh">↺ <span data-i18n="requestRefresh">Atualizar</span></button>
                        <button class="action-btn btn-ghost btn-xs text-error" id="rq-logout">
                            <span data-i18n="requestLogout">Sair</span>
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Sidebar -->
            <div class="adm-main px-5">
                <div class="rq-loading" id="rq-loading" data-i18n="requestLoadingOrders">Carregando pedidos...</div>
                <div class="is-hidden" id="rq-content"></div>
            </div>
        </div>
    </div>

<div id="footer"></div>

<script src="js/config.js"></script>
<script src="js/translation.js"></script>
<script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
<script src="js/api.service.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script>

function t(key) {
    return (LanguageManager ? LanguageManager.t(key) : null) || key;
}

const session = Auth.site;

// ── Auth ──────────────────────────────────────────────────────
document.getElementById('rq-login-google').addEventListener('click', () => {
    session.login({ onSuccess: showDashboard });
});

document.getElementById('rq-logout').addEventListener('click', () => {
    session.logout(() => {
        document.getElementById('rq-auth').classList.remove('is-hidden');
        document.getElementById('rq-dashboard').classList.add('is-hidden');
    });
});
document.getElementById('rq-refresh').addEventListener('click', loadOrders);

function showDashboard() {
    document.getElementById('rq-auth').classList.add('is-hidden');
    document.getElementById('rq-dashboard').classList.remove('is-hidden');
    document.getElementById('rq-user-name').textContent   = session.user?.name || '';
    const av = document.getElementById('rq-avatar');
    if (session.user?.picture) av.src = session.user.picture; else av.hidden = true;

    // Header title
    const hdr = document.getElementById('header');
    if (hdr) hdr.dataset.title = t('requestMyRequests');

    loadOrders();
}

if (session.restore()) showDashboard();

// ── Carregar pedidos ──────────────────────────────────────────
async function loadOrders() {
    document.getElementById('rq-loading').classList.remove('is-hidden');
    document.getElementById('rq-content').classList.add('is-hidden');
    try {
        const res = await session.fetch(`${CONFIG.REQUEST_API_BASE}/orders`);
        if (res.status === 401) return;
        const data = await res.json();
        renderOrders(data.orders || []);
    } catch(e) {
        document.getElementById('rq-loading').textContent = '⚠ ' + e.message;
    }
}

// ── Render lista ──────────────────────────────────────────────
function renderOrders(orders) {
    document.getElementById('rq-loading').classList.add('is-hidden');
    const content = document.getElementById('rq-content');
    content.classList.remove('is-hidden');

    if (!orders.length) {
        content.innerHTML = `
            <div class="empty-state">
                <h2>📦</h2>
                <h2 data-i18n="requestNoOrders">${t('requestNoOrders')}</h2>
                <p data-i18n="requestNoOrdersHint">${t('requestNoOrdersHint')}</p>
                <a href="collection.html" class="action-btn btn-primary d-inline-block mt-5 no-underline">
                    <span data-i18n="backToCollection">${t('backToCollection')}</span>
                </a>
            </div>`;
        return;
    }

    const sorted = [...orders].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    content.innerHTML = `<div class="rq-orders-list">${sorted.map(buildOrderCard).join('')}</div>`;

    // Accordion
    content.querySelectorAll('.rq-order-head').forEach(head => {
        head.addEventListener('click', () => {
            head.closest('.rq-order-card').classList.toggle('expanded');
        });
    });
}

const SPORT_ICON = { football:'⚽', multisport:'🏀', motor:'🏎️' };
const CONTACT_ICON = { email:'📧', whatsapp:'💬', telegram:'✈️', bluesky:'🦋', x:'𝕏' };

function buildOrderCard(o) {
    const now   = new Date();
    const dt    = new Date(o.createdAt).toLocaleString('pt-BR', { dateStyle:'long', timeStyle:'short' });
    const items = o.items || [];

    // Links disponíveis = itens com link ativo e não expirado
    const activeLinks = items.filter(it =>
        it.link && !it.link.disabled && (!it.link.expiresAt || new Date(it.link.expiresAt) > now)
    ).length;
    const hasAnyLink = items.some(it => it.link);

    // Pagamento: considera aprovado também quando admin liberou manualmente
    const pay        = o.payment;
    const payDone    = pay?.status === 'approved' || o.paymentAccessGranted === true;
    const payPending = o.paymentAmount > 0 && !payDone;

    // Progress bar
    const steps = [
        { key:'pending',    label: t('requestProgressReceived') },
        { key:'processing', label: t('requestProgressAnalysis') },
        { key:'ready',      label: t('requestProgressReady')    },
    ];
    const stepIdx = { pending:0, processing:1, ready:2, completed:3, expired:2, cancelled:2 };
    const curIdx  = stepIdx[o.status] ?? 0;

    const progressHtml = (o.status !== 'expired' && o.status !== 'cancelled') ? `
        <div class="prog prog-pad">
            ${steps.map((s, i) => {
                let cls = '';
                if (i < curIdx)  cls = 'done';
                if (i === curIdx) cls = 'active';
                return `<div class="prog-conn ${cls} prog-conn-min"></div><div class="prog-step">
                            <div class="prog-dot ${cls}">${i < curIdx ? `<svg width="12" height="12" viewBox="0 0 8 8" fill="none"><path class="prog-dot-svg ${cls}" d="M1.5 4l2 2 3-3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>` : `<div class="prog-dot-svg2 ${cls} dot-6"></div>`}</div>
                            <span class="prog-lbl ${cls}">${s.label}</span>
                        </div>`;
            }).join('')}
        </div>` : ``;

    // Items com link
    const itemsHtml = items.map(item => {
        const link    = item.link;
        const expired = link && link.expiresAt && new Date(link.expiresAt) < now;
        const blocked = !link || link.disabled || expired;
        const url     = link ? (link.proxyUrl || link.url || '#') : null;

        let dlMeta = '', dlMetaCls = '';
        if (!link) {
            dlMeta = t('requestLinkPending'); dlMetaCls = 'disabled';
        } else if (link.disabled) {
            dlMeta = t('requestLinkDisabled'); dlMetaCls = 'disabled';
        } else if (expired) {
            dlMeta = t('requestLinkExpired'); dlMetaCls = 'expired';
        } else if (!link.expiresAt) {
            dlMeta = t('requestLinkNoExpiry'); dlMetaCls = 'indefinite';
        } else {
            const days = Math.ceil((new Date(link.expiresAt) - now) / 86_400_000);
            dlMeta = `${t('requestLinkValidDays').replace('{n}', days)}`; dlMetaCls = 'valid';
        }

        return `
        <div class="rq-dl-card ${!blocked ? 'available' : 'blocked'}">
            <div class="rq-dl-icon">${blocked ? '🔒' : '📥'}</div>
            <div class="rq-dl-info">
                <div class="rq-dl-label">${esc(item.label)}${item.station ? ' · ' + esc(item.station) : ''}</div>
                <div class="rq-dl-meta ${dlMetaCls}">${dlMeta}</div>
            </div>
            ${!blocked && url ? `<a href="${url}" class="action-btn btn-primary no-underline shrink-0" target="_blank" rel="noopener" download
               >⬇ ${t('requestDownload')}</a>` : ''}
        </div>`;
    }).join('');

    // Aviso de pagamento pendente (sobrepõe seção de downloads)
    const payNoticeHtml = payPending ? `
            <div class="rq-section">    
        <div class="rq-notice">
                <div class="flex-1 min-w-0">
                    <div class="text-mdm fw-600 text-primary">
                        Pagamento necessário
                    </div>
                    <div class="text-sm text-secondary mt-1px">
                        Valor: <strong>R$ ${parseFloat(o.paymentAmount).toLocaleString('pt-BR',{minimumFractionDigits:2})}</strong>
                        &nbsp;· Os links serão liberados após a confirmação.
                    </div>
                </div>
                <a href="request-detail.html?id=${encodeURIComponent(o.id)}"
                    class="action-btn btn-primary no-underline shrink-0 nowrap">
                    Pagar →
                </a>
            </div>
        </div>` : '';

    // Nenhum link ainda
    const noLinks = !hasAnyLink ? `
        <div class="rq-no-links">
            ${{ pending: t('requestNoLinkPending'), processing: t('requestNoLinkProcessing'),
                ready: t('requestNoLinkReady'), completed:t('requestStatusCompleted'), expired: t('requestNoLinkExpired'),
                cancelled: t('requestNoLinkCancelled') }[o.status] || t('requestNoLinkPending')}
        </div>` : '';

    return `
    <div class="rq-order-card" id="order-${esc(o.id)}">
        <div class="rq-order-head">
            <div class="rq-order-id-wrap">
                <span class="rq-order-id">${esc(o.id)}</span>
                <span class="rq-order-date">${dt}</span>
            </div>
            <div class="rq-order-meta">
                <div>
                    <span class="rq-items-count">${items.length} ${items.length === 1 ? t('requestItemUnit') : t('requestItemsUnit')}</span>
                    ${activeLinks > 0
                        ? `<span class="rq-items-count">/ </span><span class="rq-links-badge">${activeLinks} ${activeLinks === 1 ? t('requestLinkAvailable') : t('requestLinksAvailable')}</span>`
                        : ''}
                </div>
                <span class="pill st-${o.status}">${statusPtBR(o.status)}</span>
            </div>
            <span class="rq-chevron">▼</span>
        </div>

        <div class="rq-order-body">
            ${progressHtml}

            ${payPending ? payNoticeHtml : ``}

            <div class="rq-section text-right">
                <a href="request-detail.html?id=${encodeURIComponent(o.id)}" class="rq-view-link">
                    ${t('requestViewDetail')} →
                </a>
            </div>
        </div>
    </div>`;
}

function statusPtBR(s) {
    return { pending:t('requestStatusPending'), processing:t('requestStatusProcessing'),
             ready:t('requestStatusReady'), completed:t('requestStatusCompleted'),
             expired:t('requestStatusExpired'),cancelled:t('requestStatusCancelled') }[s] || s;
}

function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>

</body>
</html>
