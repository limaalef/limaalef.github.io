<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Sports Archive">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Meus Pedidos — Sports Archive</title>
    <meta name="robots" content="noindex">
    <meta name="author" content="@limaalef">
    <!-- Ícones / manifest -->
    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/icons/site.webmanifest" />
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/request.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/ui-components.css">
    <link rel="stylesheet" href="css/my-requests.css">
</head>
<body>
    <header>
        <div class="header-frame" id="header"
            data-title-key="requestMyRequests"
            data-back="true"
            data-reqbtn="false"></div>
    </header>

    <!-- Auth -->
    <div id="rq-auth">
        <div class="icon-lg">📦</div>
        <h2 data-i18n="requestMyRequests">Meus Pedidos</h2>
        <p data-i18n="requestMyRequestsDesc">Faça login para acompanhar seus pedidos e acessar os links de download.</p>
        <button class="om-oauth-btn om-google mt-3" id="rq-login-google">
            <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.29-8.16 2.29-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span data-i18n="requestLoginGoogle">Entrar com Google</span>
        </button>
    </div>

    <!-- Dashboard -->
    <div class="is-hidden" id="rq-dashboard">
        <div class="adm-layout narrow-width">
            <!-- Conteúdo -->
            <div class="adm-main px-5">
                <h1 class="rq-title" data-i18n="requestMyRequests">Meus Pedidos</h1>
                <div class="status-message" id="rq-loading" data-i18n="requestLoadingOrders">Carregando pedidos...</div>
                <div class="is-hidden" id="rq-content"></div>
            </div>
        </div>
    </div>

<div id="footer"></div>

<script src="js/config.js"></script>
<script src="js/translation.js"></script>
<script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
<script src="js/api_service.js"></script>
<script src="js/ui-components.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script>

function t(key) {
    return (LanguageManager ? LanguageManager.t(key) : null) || key;
}
function loc() { return (LanguageManager && LanguageManager.getLanguage) ? LanguageManager.getLanguage() : 'pt-BR'; }

const session = Auth.site;

// ── Auth ──────────────────────────────────────────────────────
document.getElementById('rq-login-google').addEventListener('click', () => {
    session.login({ onSuccess: showDashboard });
});

function showDashboard() {
    document.getElementById('rq-auth').classList.add('is-hidden');
    document.getElementById('rq-dashboard').classList.remove('is-hidden');
    document.dispatchEvent(new Event('authchange'));   // header mostra o menu do usuário

    loadOrders();
}

if (session.restore()) showDashboard();

// ── Carregar pedidos ──────────────────────────────────────────
let _orders = null;   // cache para re-render ao trocar de idioma
async function loadOrders() {
    document.getElementById('rq-loading').classList.remove('is-hidden');
    document.getElementById('rq-content').classList.add('is-hidden');
    try {
        const res = await session.fetch(`${CONFIG.REQUEST_API_BASE}/orders`);
        if (res.status === 401) return;
        const data = await res.json();
        _orders = data.orders || [];
        renderOrders(_orders);
    } catch(e) {
        document.getElementById('rq-loading').textContent = '⚠ ' + e.message;
    }
}

document.addEventListener('languagechange', () => {
    if (!_orders) return;
    renderOrders(_orders);
});

// ── Render lista ──────────────────────────────────────────────
function renderOrders(orders) {
    document.getElementById('rq-loading').classList.add('is-hidden');
    const content = document.getElementById('rq-content');
    content.classList.remove('is-hidden');

    if (!orders.length) {
        content.innerHTML = `
            <div class="empty-state">
                <h2>📦</h2>
                <h2 data-i18n="requestNoOrders">${t('requestNoOrders')}</h2>
                <p data-i18n="requestNoOrdersHint">${t('requestNoOrdersHint')}</p>
                <a href="collection.html" class="button button--solid mt-5">
                    <span data-i18n="backToCollection">${t('backToCollection')}</span>
                </a>
            </div>`;
        return;
    }

    const sorted = [...orders].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    content.innerHTML = `<div class="rq-orders-list">${sorted.map(buildOrderCard).join('')}</div>`;

    // Accordion (teclado: Enter/Espaço)
    content.querySelectorAll('.rq-head').forEach(head => {
        const toggle = () => {
            const card = head.closest('.rq-order');
            const open = card.classList.toggle('expanded');
            head.setAttribute('aria-expanded', String(open));
        };
        head.addEventListener('click', toggle);
        head.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
        });
    });
}

function fmtMoney(v, cur) {
    try { return new Intl.NumberFormat(loc(), { style:'currency', currency:cur }).format(v); }
    catch(e) { return `${esc(cur)} ${Number(v).toFixed(2)}`; }
}
function fmtWhen(d) {
    return new Date(d).toLocaleString(loc(), { dateStyle:'short', timeStyle:'short' });
}

// Resumo de pagamento — mesmo formato para Pix, PayPal e liberação manual:
//   [situação]  valor · data                                   [logo do método]
function paymentSummaryHtml(o) {
    const A   = o.access || {};
    if (o.status === 'cancelled') return '';
    const pay = o.payment;
    const ext = o.externalPayment || null;
    const detail = parts => parts.filter(Boolean).join(' · ');

    // Pago via PayPal / pagamento externo registrado
    if (ext) {
        return `<div class="rq-pay">
            <div class="rq-pay-info">
                ${pill('success', t('requestPaidViaPayPal'))}
                <span class="rq-pay-detail">${detail([fmtMoney(ext.amount, ext.currency), ext.paidAt && fmtWhen(ext.paidAt)])}</span>
            </div>
        </div>`;
    }

    // Pago via Pix (Mercado Pago) ou liberado manualmente
    if (A.paid) {
        const viaPix  = !!pay?.mpPaymentId || pay?.provider === 'mercadopago';
        const amount  = pay?.amount ?? o.valueEffective?.amount;
        const cur     = pay?.currency ?? o.valueEffective?.currency ?? 'BRL';
        return `<div class="rq-pay">
            <div class="rq-pay-info">
                ${pill('success', viaPix ? t('requestPaidViaPix') : t('requestPaymentApproved'))}
                <span class="rq-pay-detail">${detail([amount != null && fmtMoney(amount, cur), pay?.paidAt && fmtWhen(pay.paidAt)])}</span>
            </div>
        </div>`;
    }

    // Aguardando pagamento: valor + botão para pagar
    if (A.showPayment) {
        const external = !!o.paymentExternal;
        const due = external ? o.externalDueEffective : o.valueEffective;
        return `<div class="rq-pay">
            <div class="rq-pay-info">
                ${pill('waiting', t('requestPaymentWaiting'))}
                ${due ? `<span class="rq-pay-detail">${fmtMoney(due.amount, due.currency)}</span>` : ''}
            </div>
            <a href="request-detail.html?id=${encodeURIComponent(o.id)}" class="button button--solid">${t('requestPayNow')}</a>
        </div>`;
    }

    // Em análise / pendente: apenas o valor combinado
    if (A.showValues && !A.unlocked && o.valueEffective) {
        return `<div class="rq-pay">
            <div class="rq-pay-info">
                <span class="rq-pay-detail">${t('requestPaymentAmountLabel')} ${fmtMoney(o.valueEffective.amount, o.valueEffective.currency)}</span>
            </div>
        </div>`;
    }
    return '';
}

function buildOrderCard(o) {
    const now   = new Date();
    const dt    = new Date(o.createdAt).toLocaleString(loc(), { dateStyle:'long', timeStyle:'short' });
    const items = o.itemCount || 0;
    const A     = o.access || {};

    const sub = [
        dt,
        `${items} ${items === 1 ? t('requestItemUnit') : t('requestItemsUnit')}`,
    ].filter(Boolean).join(' · ');

    const steps = stepsHtml(o);

    return `
    <article class="rq-order" id="order-${esc(o.id)}">
        <div class="rq-head" role="button" tabindex="0" aria-expanded="false">
            <div class="rq-head-main">
                <span class="rq-id">${esc(o.id)}</span>
                <span class="rq-sub">${sub}</span>
            </div>
            <div class="rq-head-side">
                ${pill(STATUS_KIND[o.status] || 'off', statusPtBR(o.status))}
                <span class="rq-chevron">${icon('chevron', 18)}</span>
            </div>
        </div>

        ${paymentSummaryHtml(o)}

        <div class="rq-body">
            ${steps ? `<div class="rq-steps">${steps}</div>` : ''}
            <a href="request-detail.html?id=${encodeURIComponent(o.id)}" class="button rq-detail-btn">
                ${t('requestViewDetail')} ${icon('arrow', 15)}
            </a>
        </div>
    </article>`;
}

function statusPtBR(s) {
    return { pending:t('requestStatusPending'), processing:t('requestStatusProcessing'),
             ready:t('requestStatusReady'), completed:t('requestStatusCompleted'),
             expired:t('requestStatusExpired'),cancelled:t('requestStatusCancelled') }[s] || s;
}

function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>

</body>
</html>
